# Cloudflare Pages settings for the Lumavu website. The Pages project is
# connected to this repo, so a push to main goes live; this file is where
# its settings live, and the dashboard can't override them.
name = "lumavu-website"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

# The waitlist (closed 9 Nov 2026): one entry per email address. Nothing on the site writes to it any more; it's
# kept so the people who signed up can be emailed once at launch, after which the namespace can be deleted.
[[kv_namespaces]]
binding = "WAITLIST"
id = "0dc929899adf490c9f10660a4731d11d"
